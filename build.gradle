plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.9' apply false
    id 'net.fabricmc.fabric-loom' version '1.17.9' apply false
    id 'maven-publish'
    id "me.modmuss50.mod-publish-plugin" version "0.8.4"
}

if (stonecutter.current.version < "26.1") {
    println 'using net.fabricmc.fabric-loom-remap'
    apply plugin: 'net.fabricmc.fabric-loom-remap'
} else {
    println 'using net.fabricmc.fabric-loom'
    apply plugin: 'net.fabricmc.fabric-loom'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.

    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    gradlePluginPortal()
    mavenCentral()

    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven {
        name 'Xander Maven'
        url 'https://maven.isxander.dev/releases'
    }

    maven { url "https://maven.quiltmc.org/repository/release"}

    if (stonecutter.eval(stonecutter.current.version, ">=1.20.4")) {
        maven {
            url "https://maven.nucleoid.xyz/"
            name = "Nucleoid"
        }
    }
}

println "Dependency versions:"
println "  - Minecraft: ${stonecutter.current.version}"
println "  - Stonecutter target: ${stonecutter.current.version} (project ${stonecutter.current.project})"
println "  - Fabric Loader: ${property('loader_version')}"
println "  - Fabric API: ${property('fabric_version')}"
println "  - YACL: ${property('yacl_version')}"
println "  - Mod Menu: ${property('mod_menu')}"

dependencies {
    minecraft "com.mojang:minecraft:${stonecutter.current.version}"
    if (stonecutter.current.version < "26.1") {
        mappings loom.officialMojangMappings()
    }

    def fabricLoaderString = "net.fabricmc:fabric-loader:${property('loader_version')}"
    def fabricApiString = "net.fabricmc.fabric-api:fabric-api:${property('fabric_version')}"
    def yaclString = "dev.isxander:yet-another-config-lib:${property('yacl_version')}"
    def modMenuString = "com.terraformersmc:modmenu:${property('mod_menu')}"

    if (stonecutter.current.version < "26.1") {
        modImplementation fabricLoaderString
        modImplementation fabricApiString

        modImplementation yaclString
        modApi(modMenuString)
    } else {
        implementation fabricLoaderString
        implementation fabricApiString

        implementation yaclString
        api(modMenuString)
    }
    implementation 'com.google.code.gson:gson:2.10.1'

    // todo: versioning for this
    if (stonecutter.current.version == "1.20.4") {
        modImplementation "eu.pb4:placeholder-api:2.4.0-pre.1+1.20.4"
    }

    if (stonecutter.current.version == "1.21.5") {
        modImplementation "eu.pb4:placeholder-api:2.6.1+1.21.5"
    }

    if (stonecutter.current.version == "1.21.6") {
        modImplementation "eu.pb4:placeholder-api:2.7.0+1.21.6"
    }
}

def jarArchiveFileName = "${project.archives_base_name}-${project.version}-mc-${stonecutter.current.project}.jar"

if (stonecutter.current.version < "26.1") {
    remapJar {
        archiveFileName = jarArchiveFileName
    }
} else {
    jar {
        archiveFileName = jarArchiveFileName
    }
}

def mcDep = property("mod.mc_dep").toString()

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", stonecutter.current.version
    inputs.property "loader_version", project.loader_version
    inputs.property "mcdep", mcDep
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": stonecutter.current.version,
                "loader_version": project.loader_version,
                "mcdep": mcDep
    }
}

def targetJavaVersion = 25
if (stonecutter.current.version < "1.20.6") {
    targetJavaVersion = 17
} else if (stonecutter.current.version < "26.1") {
    targetJavaVersion = 21
}

tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

def modVersion = project.mod_version

tasks.register("buildAndCollect", Copy) {
    group = "build"
    from(jarArchiveFileName)
    into(rootProject.layout.buildDirectory.file("libs/${modVersion}"))
    dependsOn("build")
}

loom {
    runConfigs.all {
        ideConfigGenerated true // Run configurations are not created for subprojects by default
        runDir "../../run" // Use a shared run folder and create separate worlds
    }
//    accessWidenerPath = project.rootProject.file("src/main/resources/aws/${stonecutter.current.project}.accesswidener")
//    accessWidenerPath = project.rootProject.file("src/main/resources/aws/1.21.4.accesswidener")
}

java {
    withSourcesJar()

    def javaVersion = JavaVersion.VERSION_25
    if (stonecutter.current.version < "1.20.6") {
        javaVersion = JavaVersion.VERSION_17
    } else if (stonecutter.current.version < "26.1") {
        javaVersion = JavaVersion.VERSION_21
    }

    println "JavaVersion: " + javaVersion.toString()
    targetCompatibility = javaVersion
    sourceCompatibility = javaVersion
}


jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

